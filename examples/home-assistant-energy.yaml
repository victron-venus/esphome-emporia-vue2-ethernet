# HOME ASSISTANT PACKAGE, not ESPHome firmware.
# Requires current Home Assistant with State.last_reported support.
# Replace BOTH raw source IDs everywhere they appear, including triggers.
# Source measurements must report fresh samples more often than every 30 seconds.
# Circuit power must be nonnegative consumption in W. Net power must be W with
# positive grid import and negative export at one verified grid boundary.
# Remove the two grid helper/integration sensors if that measurement is absent.
# These scheduled helpers are for energy estimation only: keep the ORIGINAL
# ESPHome entities as GX bridge inputs so their source timestamps are preserved.
# Validate IDs and startup/outage behavior in Home Assistant before use.

template:
  - triggers:
      - trigger: state
        entity_id:
          - sensor.vue2_circuit_01_power
          - sensor.vue2_net_power
      - trigger: time_pattern
        seconds: "/5"
      - trigger: homeassistant
        event: start
    sensor:
      - name: Vue 2 Circuit 01 Valid Power
        unique_id: vue2_circuit_01_valid_power
        default_entity_id: sensor.vue2_circuit_01_valid_power
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        availability: >-
          {%- set s = states.sensor.vue2_circuit_01_power -%}
          {%- set reported = as_timestamp(s.last_reported | default(none), none) if s is not none else none -%}
          {%- set age = as_timestamp(now()) - reported if reported is not none else none -%}
          {{ s is not none and is_number(s.state)
             and s.attributes.get('unit_of_measurement') == 'W'
             and s.state | float >= 0
             and age is not none and 0 <= age <= 30 }}
        state: >-
          {%- set raw = states('sensor.vue2_circuit_01_power') -%}
          {{ raw | float if is_number(raw) and raw | float >= 0 else none }}
      - name: Vue 2 Grid Import Power
        unique_id: vue2_grid_import_power
        default_entity_id: sensor.vue2_grid_import_power
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        availability: &net_power_available >-
          {%- set s = states.sensor.vue2_net_power -%}
          {%- set reported = as_timestamp(s.last_reported | default(none), none) if s is not none else none -%}
          {%- set age = as_timestamp(now()) - reported if reported is not none else none -%}
          {{ s is not none and is_number(s.state)
             and s.attributes.get('unit_of_measurement') == 'W'
             and age is not none and 0 <= age <= 30 }}
        state: >-
          {%- set raw = states('sensor.vue2_net_power') -%}
          {{ [raw | float, 0] | max if is_number(raw) else none }}
      - name: Vue 2 Grid Export Power
        unique_id: vue2_grid_export_power
        default_entity_id: sensor.vue2_grid_export_power
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        availability: *net_power_available
        state: >-
          {%- set raw = states('sensor.vue2_net_power') -%}
          {{ [-(raw | float), 0] | max if is_number(raw) else none }}

sensor:
  - platform: integration
    source: sensor.vue2_circuit_01_valid_power
    name: Vue 2 Circuit 01 Energy
    unique_id: vue2_circuit_01_energy
    unit_prefix: k
    unit_time: h
    method: left
    round: 4
    max_sub_interval:
      minutes: 1
  - platform: integration
    source: sensor.vue2_grid_import_power
    name: Vue 2 Grid Import Energy
    unique_id: vue2_grid_import_energy
    unit_prefix: k
    unit_time: h
    method: left
    round: 4
    max_sub_interval:
      minutes: 1
  - platform: integration
    source: sensor.vue2_grid_export_power
    name: Vue 2 Grid Export Energy
    unique_id: vue2_grid_export_energy
    unit_prefix: k
    unit_time: h
    method: left
    round: 4
    max_sub_interval:
      minutes: 1
