# NEVER FLASH: shared compiler-only settings with synthetic metering.
substitutions:
  test_api_key: REPLACE_WITH_TEMPORARY_BASE64_TEST_KEY
  test_ota_password: REPLACE_WITH_TEMPORARY_TEST_PASSWORD

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

external_components:
  - source:
      type: git
      url: https://github.com/emporia-vue-local/esphome.git
      ref: 79e2747371b70370b96ef919f7c1e556f461344a
    components: [emporia_vue]
    refresh: never

logger:
  baud_rate: 0
  logs:
    sensor: INFO

api:
  encryption:
    key: ${test_api_key}

ota:
  - platform: esphome
    password: ${test_ota_password}

i2c:
  id: meter_i2c
  sda: GPIO21
  scl: GPIO22
  scan: false
  frequency: 400kHz
  timeout: 1ms

# No status LED: the five-signal fixture assigns GPIO23 to reset.
sensor:
  - platform: emporia_vue
    variant: vue2
    i2c_id: meter_i2c
    phases:
      - id: phase_a
        input: BLACK
        calibration: 0.022
        voltage:
          name: Synthetic Test Voltage
    ct_clamps:
      - phase_id: phase_a
        input: A
        power:
          name: Synthetic Test Power
