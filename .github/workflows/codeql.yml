name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '47 8 * * 2'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  scan:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@ecb29d724aee35aba541f7a0a379dfef424c088e # main
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      languages: actions,python
      force-full: true
      run-codeql: true
      run-trivy: false
      run-dependency-review: false
