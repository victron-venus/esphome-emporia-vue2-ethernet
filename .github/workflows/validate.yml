name: Documentation and examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Documentation and examples
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install documentation parser
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary :all: -c requirements-checks.txt -r requirements-checks.lock
      - name: Check documentation and examples
        run: python scripts/check.py
      - name: Test source validation edge cases
        run: python -m unittest discover -s tests -v
      - name: Test Home Assistant template edge cases
        run: python -m unittest discover -s examples/tests -v

  firmware:
    name: ESPHome configuration and generation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/esphome/esphome:2026.10.0@sha256:1dff19a59070cdb523b76576cdc74d200f862d43c1407809088855920cf57145
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate isolated synthetic configurations
        run: python3 firmware/validate.py
