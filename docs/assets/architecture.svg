<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">Emporia Vue 2: a local Ethernet path to Home Assistant and Victron</title>
  <desc id="desc">Four stages: preserve Vue 2 measurements on SAMD09 and I2C; add a W5500 SPI Ethernet module; send encrypted ESPHome API measurements to Home Assistant; forward selected power entities through dbus-emporia-vue to individual Victron AC-load services. Hardware remains experimental.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1224"/><stop offset="1" stop-color="#172b45"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a8bbd5"/></marker>
    <style>text{font-family:DejaVu Sans,Arial,sans-serif}.title{font-size:34px;font-weight:700;fill:#f8fafc}.sub{font-size:18px;fill:#b8c8de}.label{font-size:13px;font-weight:700;letter-spacing:1.8px}.name{font-size:25px;font-weight:700;fill:#f8fafc}.body{font-size:16px;fill:#d5e1ef}.small{font-size:14px;fill:#b8c8de}</style>
  </defs>
  <rect width="1280" height="650" rx="24" fill="url(#bg)"/>
  <text x="40" y="44" class="label" fill="#5eead4">WIRED MEASUREMENTS · LOCAL INTEGRATION</text>
  <text x="40" y="92" class="title">One device. A connected energy ecosystem.</text>
  <text x="40" y="125" class="sub">Preserve the metering hardware. Add Ethernet. Reuse the existing software bridges.</text>

  <g transform="translate(40 182)">
    <rect width="270" height="246" rx="16" fill="#142d50" stroke="#60a5fa" stroke-width="2"/>
    <rect x="20" y="20" width="34" height="34" rx="10" fill="#2563eb"/><text x="37" y="43" text-anchor="middle" class="body" font-weight="700">1</text>
    <text x="68" y="43" class="label" fill="#93c5fd">MEASURE</text>
    <text x="20" y="92" class="name">Emporia Vue 2</text>
    <text x="20" y="128" class="body">CTs · SAMD09 · ESP32</text>
    <text x="20" y="155" class="body">Existing measurement I2C</text>
    <text x="20" y="182" class="body">ESPHome application</text>
    <line x1="20" y1="201" x2="250" y2="201" stroke="#385270"/>
    <text x="20" y="226" class="small">Factory SAMD09 retained</text>
  </g>
  <g transform="translate(350 182)">
    <rect width="270" height="246" rx="16" fill="#382c24" stroke="#fbbf24" stroke-width="2"/>
    <rect x="20" y="20" width="34" height="34" rx="10" fill="#b45309"/><text x="37" y="43" text-anchor="middle" class="body" font-weight="700">2</text>
    <text x="68" y="43" class="label" fill="#fcd34d">CONNECT</text>
    <text x="20" y="92" class="name">W5500 + RJ45</text>
    <text x="20" y="128" class="body">SPI Ethernet controller</text>
    <text x="20" y="155" class="body">Polling; no interrupt line</text>
    <text x="20" y="182" class="body">Reset + power validation</text>
    <line x1="20" y1="201" x2="250" y2="201" stroke="#6b5135"/>
    <text x="20" y="226" class="small">Experimental hardware stage</text>
  </g>
  <g transform="translate(660 182)">
    <rect width="270" height="246" rx="16" fill="#143b3c" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="20" y="20" width="34" height="34" rx="10" fill="#0f766e"/><text x="37" y="43" text-anchor="middle" class="body" font-weight="700">3</text>
    <text x="68" y="43" class="label" fill="#5eead4">UNDERSTAND</text>
    <text x="20" y="92" class="name">Home Assistant</text>
    <text x="20" y="128" class="body">Encrypted ESPHome API</text>
    <text x="20" y="155" class="body">Power + energy entities</text>
    <text x="20" y="182" class="body">Dashboards + history</text>
    <line x1="20" y1="201" x2="250" y2="201" stroke="#2f6262"/>
    <text x="20" y="226" class="small">Validate units and availability</text>
  </g>
  <g transform="translate(970 182)">
    <rect width="270" height="246" rx="16" fill="#30264e" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="20" y="20" width="34" height="34" rx="10" fill="#7c3aed"/><text x="37" y="43" text-anchor="middle" class="body" font-weight="700">4</text>
    <text x="68" y="43" class="label" fill="#ddd6fe">INTEGRATE</text>
    <text x="20" y="92" class="name">Victron GX</text>
    <text x="20" y="128" class="body">dbus-emporia-vue</text>
    <text x="20" y="155" class="body">HA WebSocket source</text>
    <text x="20" y="182" class="body">Individual AC-load services</text>
    <line x1="20" y1="201" x2="250" y2="201" stroke="#594674"/>
    <text x="20" y="226" class="small">Venus OS monitoring</text>
  </g>
  <path d="M315 297 H339 M625 297 H649 M935 297 H959" stroke="#a8bbd5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="330" y="169" text-anchor="middle" class="small">SPI</text>
  <text x="640" y="169" text-anchor="middle" class="small">LAN</text>
  <text x="950" y="169" text-anchor="middle" class="small">HA API</text>
  <rect x="40" y="466" width="580" height="128" rx="16" fill="#0c1a2e" stroke="#385270"/>
  <text x="62" y="498" class="label" fill="#93c5fd">PRESERVED MEASUREMENT PATH</text>
  <text x="62" y="530" class="body">I2C SDA GPIO21 / SCL GPIO22 remain dedicated.</text>
  <text x="62" y="557" class="body">Calibration, phase mapping and CT direction still matter.</text>
  <rect x="660" y="466" width="580" height="128" rx="16" fill="#0c1a2e" stroke="#385270"/>
  <text x="682" y="498" class="label" fill="#ddd6fe">MONITORING CONTRACT</text>
  <text x="682" y="530" class="body">Circuit readings become com.victronenergy.acload.</text>
  <text x="682" y="557" class="body">This path is not a validated ESS grid-control input.</text>
  <text x="40" y="626" class="small">Conceptual architecture · Hardware and end-to-end validation are required.</text>
</svg>
