<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">W5500 reset pulse: driver request compared with datasheet minimum</title>
  <desc id="desc">A zero-based bar chart compares the 100-microsecond delay requested while RSTn is low in the ESP-IDF 5.5.6 W5500 driver with the W5500 datasheet minimum low pulse of 500 microseconds. The required minimum is five times the requested delay. These values come from code and documentation, not a measured waveform or proof every module fails. This version has a source-level timing gap and no implemented workaround is claimed.</desc>
  <rect width="1200" height="520" fill="#f3f6fb"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="55" font-size="30" font-weight="700" fill="#10233f">W5500 reset pulse timing</text>
    <rect x="780" y="27" width="380" height="36" rx="18" fill="#e8edf5" stroke="#cbd5e1"/>
    <text x="970" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#364b68">CODE / DATASHEET · NOT A MEASUREMENT</text>
    <text x="40" y="94" font-size="18" fill="#52627a">Requested RSTn LOW delay versus the chip's required minimum.</text>

    <rect x="28" y="125" width="1144" height="283" rx="20" fill="#ffffff" stroke="#d6e0ed"/>
    <g stroke="#e4eaf2" stroke-width="1">
      <path d="M 370 155 V 349"/>
      <path d="M 510 155 V 349"/>
      <path d="M 650 155 V 349"/>
      <path d="M 790 155 V 349"/>
      <path d="M 930 155 V 349"/>
      <path d="M 1070 155 V 349"/>
    </g>

    <text x="52" y="191" font-size="20" font-weight="700" fill="#92400e">ESP-IDF 5.5.6</text>
    <text x="52" y="217" font-size="14" fill="#65758b">Delay requested in reset_hw()</text>
    <rect x="370" y="172" width="140" height="50" rx="6" fill="#e69b28"/>
    <text x="529" y="204" font-size="22" font-weight="700" fill="#92400e">100 µs</text>

    <text x="52" y="288" font-size="20" font-weight="700" fill="#0f766e">W5500 datasheet</text>
    <text x="52" y="314" font-size="14" fill="#65758b">Minimum RSTn LOW pulse</text>
    <rect x="370" y="269" width="700" height="50" rx="6" fill="#0d9488"/>
    <text x="1085" y="301" font-size="20" font-weight="700" fill="#0f766e">500 µs</text>

    <path d="M 370 349 H 1070" stroke="#b8c5d6" stroke-width="1.5"/>
    <g font-size="13" fill="#65758b" text-anchor="middle">
      <text x="370" y="371">0</text>
      <text x="510" y="371">100</text>
      <text x="650" y="371">200</text>
      <text x="790" y="371">300</text>
      <text x="930" y="371">400</text>
      <text x="1070" y="371">500</text>
      <text x="720" y="394">Duration in microseconds · zero-based scale</text>
    </g>

    <rect x="40" y="430" width="1120" height="49" rx="12" fill="#fff3e2" stroke="#f2cf94"/>
    <text x="59" y="461" font-size="17" font-weight="700" fill="#92400e">Source-level timing gap: 500 µs minimum versus 100 µs requested in the version shown.</text>
    <text x="40" y="503" font-size="13" fill="#65758b">Not a measured failure rate. Actual pulse width and reset release-to-SPI settling still require verification.</text>
  </g>
</svg>
